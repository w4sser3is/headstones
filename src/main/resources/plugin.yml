name: Headstones
description: Don't lose your precious items when you die!
authors: [ alex3025 ]
website: https://alex3025.tk

version: '${project.version}'
api-version: 1.18
main: tk.alex3025.headstones.Headstones

commands:
  headstones:
    description: Shows my name and the plugin's version.
    aliases: [ hs, headstone ]
    usage: /headstones

permissions:
  headstones.reload:
    description: Reloads the configuration and translations file.
    default: op
  headstones.cleardb:
    description: Dangerous command to make all the existing heastones useless.
    default: op
  headstones.unplaced:
    description: Allows managing unplaced headstones.
    default: op
  headstones.destroy:
    description: Allows destroying all headstones of a player and restoring their items and experience.
    default: op
  headstones.keep-experience:
    description: Allows the player to get his experience back when he breaks its headstone.
    default: true
  headstones.keep-inventory:
    description: Same as above but for the inventory(items).
    default: true
  headstones.list:
    description: Allows the player to see the coordinates of his headstones.
    default: true
  headstones.tp:
    description: Allows the player to teleport to his headstones.
    default: true
  headstones.allow-opponents:
    description: Controls if the opponent can loot headstone.
    default: false
  headstones.disabled.*:
    description: Disables the creation of headstones in a specific world.
    default: false
